name: CI

# Lint + test + build op elke push naar main en op elke PR (incl. Dependabot),
# zodat dependency-PR's meteen groen/rood tonen. Draait op ubuntu (1×-tarief)
# en bewaart geen artifacts → blijft binnen het gratis Actions-tegoed.
on:
  push:
    branches: [main]
  pull_request:

# nieuwe push op dezelfde branch annuleert een nog lopende run (scheelt minuten)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24 # gelijk aan de runtime in de Dockerfile
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
