# Generiek voorbeeld voor zelfhosten op elke Docker-host. Hang de container
# daarna achter een reverse proxy (bv. Nginx Proxy Manager) voor TLS - zie
# README. Draait hier zelf via Arcane (TrueNAS SCALE), niet via dit bestand
# direct; dit is dus vooral een referentie/startpunt voor je eigen setup.

services:
  website:
    # Kant-en-klaar image van ghcr.io (gebouwd door GitHub Actions, privé).
    # Pull/update i.p.v. lokaal bouwen: `docker compose pull && docker compose up -d`.
    # Eenmalig inloggen op de Docker-host: zie README. Lokaal zelf bouwen?
    # Vervang deze regel tijdelijk door `build: .`.
    image: ghcr.io/arjankapteijn/website:latest
    container_name: arjankapteijn-website
    restart: unless-stopped
    ports:
      # host-poort 8090 → container-poort 8080; pas de linkerkant gerust aan
      - '8090:8080'
    env_file: .env # SMTP-, Signal- en SolarEdge-gegevens; zie .env.example
    volumes:
      # Alleen nodig voor de serverstatus-widget (statfs op deze mount voor
      # vrije schijfruimte) - er wordt zelf niets naar weggeschreven, het
      # scheepslogboek gaat via Signal, niet naar bestand.
      - ./data:/data
    # ── hardening ── (image draait al als niet-root, zie Dockerfile `USER app`)
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m
    mem_limit: 256m
    pids_limit: 64
